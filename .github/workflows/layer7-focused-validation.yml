name: Layer 7 Volatility Regime Focused Validation
on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/market_regime_context.py"
      - "backend/app/services/market_context_dummy_api.py"
      - "backend/tests/test_layer7_volatility_regime.py"
      - ".github/workflows/layer7-focused-validation.yml"
  pull_request:
    paths:
      - "backend/app/services/market_regime_context.py"
      - "backend/app/services/market_context_dummy_api.py"
      - "backend/tests/test_layer7_volatility_regime.py"
      - ".github/workflows/layer7-focused-validation.yml"
jobs:
  layer7-volatility-regime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile Layer 7 source and tests
        run: python -m compileall -q backend/app/services/market_regime_context.py backend/app/services/market_context_dummy_api.py backend/tests/test_layer7_volatility_regime.py
      - name: Run Layer 7 focused tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q tests/test_layer7_volatility_regime.py tests/test_phase9_market_regime_context.py
