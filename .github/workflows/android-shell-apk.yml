name: Build Android Remote Shell APK
on:
  workflow_dispatch:
  push:
    branches:
      - android-remote-shell
    paths:
      - 'frontend/capacitor.config.json'
      - 'frontend/package.json'
      - '.github/workflows/android-shell-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Android shell branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install shell dependencies
        run: npm install
      - name: Generate Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderFlow-Scalper-Remote-Shell-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
