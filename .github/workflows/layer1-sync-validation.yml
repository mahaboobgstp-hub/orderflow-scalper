name: Layer 1 Order Book Synchronization Validation
on:
  push:
    branches: [main]
    paths:
      - "backend/app/market_data/backend_stream.py"
      - "backend/app/market_data/unified_engine.py"
      - "backend/app/exchanges/public_adapters.py"
      - "backend/tests/test_layer1_order_book_sync.py"
      - "backend/tests/test_phase3_unified_market_data.py"
      - ".github/workflows/layer1-sync-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/market_data/backend_stream.py"
      - "backend/app/market_data/unified_engine.py"
      - "backend/app/exchanges/public_adapters.py"
      - "backend/app/exchanges/manager.py"
      - "backend/app/main.py"
      - "backend/tests/test_layer1_order_book_sync.py"
      - "backend/tests/test_phase3_unified_market_data.py"
      - "backend/tests/test_phase1_feed_diagnostics.py"
      - "backend/tests/test_phase5_imbalance_detector.py"
      - ".github/workflows/layer1-sync-validation.yml"
jobs:
  layer1-sync-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Compile market data modules
        run: python -m compileall -q backend/app/market_data
      - name: Run Layer 1 synchronization regression tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q tests/test_layer1_order_book_sync.py tests/test_phase3_unified_market_data.py tests/test_phase5_imbalance_detector.py
