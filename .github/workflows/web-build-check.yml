name: Web Frontend Build Check
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/app/market_data/**'
      - 'backend/app/main.py'
      - 'backend/tests/test_phase1_feed_diagnostics.py'
      - 'backend/tests/test_phase1_depth_event_integrity.py'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/app/market_data/**'
      - 'backend/app/main.py'
      - 'backend/tests/test_phase1_feed_diagnostics.py'
      - 'backend/tests/test_phase1_depth_event_integrity.py'
      - '.github/workflows/web-build-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run feed freshness tests
        working-directory: frontend
        run: npm test
      - name: Build Vite frontend
        working-directory: frontend
        run: npm run build
