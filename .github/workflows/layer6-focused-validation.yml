name: Layer 6 Spread Liquidity Focused Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/tests/test_layer6_spread_liquidity.py"
      - ".github/workflows/layer6-focused-validation.yml"
  pull_request:
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/tests/test_layer6_spread_liquidity.py"
      - ".github/workflows/layer6-focused-validation.yml"

jobs:
  layer6-spread-liquidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile Layer 6 source and tests
        run: python -m compileall -q backend/app/services/nine_layer_decision_engine.py backend/tests/test_layer6_spread_liquidity.py
      - name: Run Layer 6 focused suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -vv tests/test_layer6_spread_liquidity.py tests/test_phase8_nine_layer_integration.py
