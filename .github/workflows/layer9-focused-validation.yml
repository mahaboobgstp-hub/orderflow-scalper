name: Layer 9 Risk and Execution Gate Focused Validation
on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/app/services/risk_management.py"
      - "backend/tests/test_layer9_risk_execution_gate.py"
      - "backend/tests/test_phase10_risk_management.py"
      - ".github/workflows/layer9-focused-validation.yml"
  pull_request:
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/app/services/risk_management.py"
      - "backend/tests/test_layer9_risk_execution_gate.py"
      - ".github/workflows/layer9-focused-validation.yml"
jobs:
  layer9-risk-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile Layer 9 source and tests
        run: python -m compileall -q backend/app/services/nine_layer_decision_engine.py backend/app/services/risk_management.py backend/tests/test_layer9_risk_execution_gate.py
      - name: Run Layer 9 focused tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q tests/test_layer9_risk_execution_gate.py tests/test_phase10_risk_management.py tests/test_phase8_nine_layer_integration.py
