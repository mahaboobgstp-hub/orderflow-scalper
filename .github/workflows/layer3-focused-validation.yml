name: Layer 3 Focused Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/liquidity_zone_detector.py"
      - "backend/tests/test_phase7_liquidity_zone_detector.py"
      - "backend/tests/test_phase7_api_integration.py"
      - ".github/workflows/layer3-focused-validation.yml"
  pull_request:
    paths:
      - "backend/app/services/liquidity_zone_detector.py"
      - "backend/tests/test_phase7_liquidity_zone_detector.py"
      - ".github/workflows/layer3-focused-validation.yml"

jobs:
  layer3-liquidity-zones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile detector and focused tests
        run: python -m compileall -q backend/app/services/liquidity_zone_detector.py backend/tests/test_phase7_liquidity_zone_detector.py
      - name: Run Layer 3 tests with verbose evidence
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -vv tests/test_phase7_liquidity_zone_detector.py tests/test_phase7_api_integration.py
