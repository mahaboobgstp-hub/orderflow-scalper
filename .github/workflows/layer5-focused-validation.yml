name: Layer 5 Momentum Focused Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/tests/test_layer5_momentum_integration.py"
      - ".github/workflows/layer5-focused-validation.yml"
  pull_request:
    paths:
      - "backend/app/services/nine_layer_decision_engine.py"
      - "backend/tests/test_layer5_momentum_integration.py"
      - ".github/workflows/layer5-focused-validation.yml"

jobs:
  layer5-momentum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile Layer 5 source and tests
        run: python -m compileall -q backend/app/services/nine_layer_decision_engine.py backend/tests/test_layer5_momentum_integration.py
      - name: Run Layer 5 focused suite
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -vv tests/test_layer5_momentum_integration.py tests/test_phase8_nine_layer_integration.py
